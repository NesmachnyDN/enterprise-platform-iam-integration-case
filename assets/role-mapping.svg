<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Directory group to platform role mapping</title>
  <desc id="desc">Synthetic access model showing IAM provisioning into directory groups and mapping to platform RBAC permissions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a3a"/><stop offset="1" stop-color="#0b4e91"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8ec5ff"/></marker>
  </defs>
  <rect width="1280" height="520" rx="30" fill="url(#bg)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="64" y="74" fill="#fff" font-size="34" font-weight="700">Устойчивая граница авторизации</text>
    <text x="64" y="112" fill="#b9dcff" font-size="20">IAM управляет членством в группах; платформа сопоставляет группы своим RBAC-ролям.</text>

    <g transform="translate(65 190)">
      <rect x="0" y="0" width="190" height="100" rx="18" fill="#123b72" stroke="#8ec5ff" stroke-width="2"/>
      <text x="95" y="45" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Enterprise IAM</text>
      <text x="95" y="72" text-anchor="middle" fill="#b9dcff" font-size="16">lifecycle owner</text>

      <rect x="330" y="0" width="230" height="100" rx="18" fill="#123b72" stroke="#8ec5ff" stroke-width="2"/>
      <text x="445" y="42" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Directory Group</text>
      <text x="445" y="71" text-anchor="middle" fill="#b9dcff" font-size="16">stable entitlement</text>

      <rect x="665" y="0" width="220" height="100" rx="18" fill="#d9f1ff" stroke="#8ec5ff" stroke-width="2"/>
      <text x="775" y="42" text-anchor="middle" fill="#071a3a" font-size="23" font-weight="700">Platform Role</text>
      <text x="775" y="71" text-anchor="middle" fill="#23496f" font-size="16">application RBAC</text>

      <rect x="990" y="0" width="190" height="100" rx="18" fill="#123b72" stroke="#8ec5ff" stroke-width="2"/>
      <text x="1085" y="42" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Permissions</text>
      <text x="1085" y="71" text-anchor="middle" fill="#b9dcff" font-size="16">runtime access</text>

      <path d="M190 50 H330" stroke="#8ec5ff" stroke-width="4" marker-end="url(#arrow)"/>
      <path d="M560 50 H665" stroke="#8ec5ff" stroke-width="4" marker-end="url(#arrow)"/>
      <path d="M885 50 H990" stroke="#8ec5ff" stroke-width="4" marker-end="url(#arrow)"/>
      <text x="260" y="34" text-anchor="middle" fill="#b9dcff" font-size="15">provision</text>
      <text x="612" y="34" text-anchor="middle" fill="#b9dcff" font-size="15">map</text>
      <text x="938" y="34" text-anchor="middle" fill="#b9dcff" font-size="15">resolve</text>
    </g>

    <rect x="64" y="365" width="1152" height="82" rx="16" fill="#092950" stroke="#4e91ca"/>
    <text x="92" y="399" fill="#d9f1ff" font-size="18" font-weight="700">Контракт между системами:</text>
    <text x="92" y="428" fill="#b9dcff" font-size="17">IAM не передает приложению произвольные права; управляемым интерфейсом является членство в утвержденных группах каталога.</text>
  </g>
</svg>