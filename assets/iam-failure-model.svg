<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc"><title id="title">IAM Failure Containment</title><desc id="desc">IAM outage affects access administration while existing runtime platform access can continue</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#eaf2fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f91"/></marker></defs><rect width="1280" height="620" rx="28" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="58" y="70" font-size="34" font-weight="700" fill="#12375f">IAM Failure Containment</text><text x="58" y="104" font-size="18" fill="#56738f">Control-plane degradation must not automatically become a business-runtime outage</text>
<rect x="70" y="160" width="475" height="370" rx="22" fill="#fff4f4" stroke="#c16b6b" stroke-width="2"/><text x="96" y="200" font-size="21" font-weight="700" fill="#9b3c3c">CONTROL PLANE — DEGRADED</text><rect x="145" y="245" width="320" height="72" rx="16" fill="#f9dede" stroke="#c16b6b"/><text x="245" y="287" font-size="20" font-weight="700" fill="#8d3333">IAM UNAVAILABLE</text><path d="M305 317v48" stroke="#a24e4e" stroke-width="3" marker-end="url(#a)"/><rect x="115" y="365" width="380" height="105" rx="16" fill="#fff" stroke="#d49a9a"/><text x="143" y="401" font-size="17" fill="#7b4b4b">• New assignments pause / queue</text><text x="143" y="429" font-size="17" fill="#7b4b4b">• Normal changes/revocations pause</text><text x="143" y="457" font-size="17" fill="#7b4b4b">• Emergency path is explicit and governed</text>
<rect x="615" y="160" width="595" height="370" rx="22" fill="#eef7ff" stroke="#6da4d6" stroke-width="2"/><text x="642" y="200" font-size="21" font-weight="700" fill="#174b7b">RUNTIME PLANE — AVAILABLE</text><rect x="680" y="270" width="160" height="72" rx="16" fill="#fff" stroke="#6da4d6"/><rect x="900" y="270" width="190" height="72" rx="16" fill="#d9ecff" stroke="#347ab7"/><text x="716" y="312" font-size="18" font-weight="700" fill="#173f66">DIRECTORY</text><text x="942" y="312" font-size="18" font-weight="700" fill="#12375f">PLATFORM</text><path d="M840 306h60" stroke="#315f91" stroke-width="3" marker-end="url(#a)"/><text x="723" y="390" font-size="17" fill="#46698d">Existing user</text><path d="M801 372v-30" stroke="#315f91" stroke-width="2" marker-end="url(#a)"/><text x="760" y="445" font-size="20" font-weight="700" fill="#20633a">Existing governed access continues</text><text x="58" y="580" font-size="16" fill="#56738f">Trade-off: access-state changes can be delayed; runtime availability is protected from an unnecessary IAM dependency.</text></g></svg>