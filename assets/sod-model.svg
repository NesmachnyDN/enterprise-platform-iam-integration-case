<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Segregation of Duties model</title>
  <desc id="desc">Synthetic SoD model showing incompatible administrative roles and independent access control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a3a"/><stop offset="1" stop-color="#0b4e91"/></linearGradient>
  </defs>
  <rect width="1280" height="560" rx="30" fill="url(#bg)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="64" y="72" fill="#fff" font-size="34" font-weight="700">Segregation of Duties</text>
    <text x="64" y="110" fill="#b9dcff" font-size="20">Критические полномочия проектируются так, чтобы изменение и независимый контроль не концентрировались у одного субъекта.</text>

    <g transform="translate(86 185)">
      <rect x="0" y="0" width="275" height="82" rx="18" fill="#123b72" stroke="#8ec5ff" stroke-width="2"/>
      <text x="137" y="34" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Platform Administrator</text>
      <text x="137" y="60" text-anchor="middle" fill="#b9dcff" font-size="15">changes platform configuration</text>

      <rect x="0" y="132" width="275" height="82" rx="18" fill="#123b72" stroke="#8ec5ff" stroke-width="2"/>
      <text x="137" y="166" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Security Administrator</text>
      <text x="137" y="192" text-anchor="middle" fill="#b9dcff" font-size="15">changes security settings</text>

      <rect x="0" y="264" width="275" height="82" rx="18" fill="#123b72" stroke="#8ec5ff" stroke-width="2"/>
      <text x="137" y="298" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Integration Administrator</text>
      <text x="137" y="324" text-anchor="middle" fill="#b9dcff" font-size="15">changes integration settings</text>

      <circle cx="485" cy="41" r="31" fill="#7d2637" stroke="#ff9baa" stroke-width="2"/>
      <text x="485" y="50" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">×</text>
      <circle cx="485" cy="173" r="31" fill="#7d2637" stroke="#ff9baa" stroke-width="2"/>
      <text x="485" y="182" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">×</text>
      <circle cx="485" cy="305" r="31" fill="#7d2637" stroke="#ff9baa" stroke-width="2"/>
      <text x="485" y="314" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">×</text>

      <path d="M275 41 H454 M516 41 H655" stroke="#ff9baa" stroke-width="3"/>
      <path d="M275 173 H454 M516 173 H655" stroke="#ff9baa" stroke-width="3"/>
      <path d="M275 305 H454 M516 305 H655" stroke="#ff9baa" stroke-width="3"/>

      <rect x="655" y="0" width="360" height="214" rx="20" fill="#d9f1ff" stroke="#8ec5ff" stroke-width="2"/>
      <text x="835" y="40" text-anchor="middle" fill="#071a3a" font-size="24" font-weight="700">Access Controller</text>
      <text x="835" y="76" text-anchor="middle" fill="#23496f" font-size="16">independent review</text>
      <text x="690" y="118" fill="#23496f" font-size="16">• checks approved entitlements</text>
      <text x="690" y="148" fill="#23496f" font-size="16">• detects conflicting assignments</text>
      <text x="690" y="178" fill="#23496f" font-size="16">• reviews reconciliation results</text>

      <rect x="655" y="264" width="360" height="82" rx="18" fill="#123b72" stroke="#8ec5ff" stroke-width="2"/>
      <text x="835" y="298" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Integration Security Admin</text>
      <text x="835" y="324" text-anchor="middle" fill="#b9dcff" font-size="15">independent security control</text>
    </g>

    <text x="86" y="523" fill="#b9dcff" font-size="17">Конфликт ролей — архитектурное правило каталога доступа, а не договоренность между администраторами.</text>
  </g>
</svg>