<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc"><title id="title">Governed Access Lifecycle</title><desc id="desc">Request approval provision use reconciliation review and deprovision lifecycle</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#eaf2fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f91"/></marker></defs><rect width="1280" height="520" rx="28" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="58" y="70" font-size="34" font-weight="700" fill="#12375f">Governed Access Lifecycle</text><text x="58" y="104" font-size="18" fill="#56738f">Access is a controlled lifecycle, not a one-time permission assignment</text>
<g font-size="17" font-weight="700" text-anchor="middle"><rect x="60" y="210" width="135" height="70" rx="16" fill="#fff" stroke="#6da4d6"/><text x="127" y="251" fill="#173f66">REQUEST</text><rect x="230" y="210" width="135" height="70" rx="16" fill="#fff" stroke="#6da4d6"/><text x="297" y="251" fill="#173f66">APPROVAL</text><rect x="400" y="210" width="135" height="70" rx="16" fill="#d9ecff" stroke="#347ab7"/><text x="467" y="251" fill="#12375f">PROVISION</text><rect x="570" y="210" width="135" height="70" rx="16" fill="#fff" stroke="#6da4d6"/><text x="637" y="251" fill="#173f66">USE</text><rect x="740" y="210" width="150" height="70" rx="16" fill="#fff" stroke="#6da4d6"/><text x="815" y="251" fill="#173f66">RECONCILE</text><rect x="925" y="210" width="135" height="70" rx="16" fill="#fff" stroke="#6da4d6"/><text x="992" y="251" fill="#173f66">REVIEW</text><rect x="1095" y="210" width="135" height="70" rx="16" fill="#d9ecff" stroke="#347ab7"/><text x="1162" y="251" fill="#12375f">REVOKE</text></g>
<path d="M195 245h35M365 245h35M535 245h35M705 245h35M890 245h35M1060 245h35" stroke="#315f91" stroke-width="3" marker-end="url(#a)"/><path d="M992 280v92H637v-92" fill="none" stroke="#6a8cac" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="778" y="397" font-size="15" fill="#56738f">RETAIN → continue governed use</text><text x="58" y="460" font-size="17" font-weight="700" fill="#174b7b">Invariant:</text><text x="145" y="460" font-size="17" fill="#46698d">every effective production role remains traceable to an approved entitlement and directory group.</text></g></svg>